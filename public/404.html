<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gestión de Grúas</title>
  <script>
    // Truco SPA para GitHub Pages:
    // Redirige rutas desconocidas a index.html preservando la URL como query string
    // para que React Router pueda recuperarla.
    var pathSegmentsToKeep = 1; // 1 = mantener /gruas-app/ como base
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
